name: Build Windows Installer (.exe & .msi)

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    name: Windows x64 NSIS (.exe) & MSI Build
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust stable MSVC toolchain (x64)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Ensure NSIS is available
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y
          }
          makensis -VERSION

      - name: Install npm dependencies
        run: npm ci || npm install

      - name: TypeScript typecheck
        run: npm run lint

      - name: Verify Rust Windows compilation
        working-directory: src-tauri
        run: cargo check --all-targets

      - name: Build Tauri Windows x64 installers (NSIS .exe & MSI)
        run: npm run tauri build -- --bundles nsis,msi

      - name: Verify generated Windows installers
        shell: pwsh
        run: |
          $nsis = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -ErrorAction SilentlyContinue
          $msi = Get-ChildItem -Path "src-tauri/target/release/bundle/msi" -Filter "*.msi" -ErrorAction SilentlyContinue
          if (-not $nsis) {
            Write-Error "No NSIS .exe installer found in src-tauri/target/release/bundle/nsis/"
            exit 1
          }
          Write-Host "Generated NSIS installer(s):"
          $nsis | ForEach-Object { Write-Host " - $($_.FullName)" }
          if ($msi) {
            Write-Host "Generated MSI installer(s):"
            $msi | ForEach-Object { Write-Host " - $($_.FullName)" }
          }

      - name: Upload Windows .exe installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SysMon-Pro-Windows-x64-Setup
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Publish GitHub Release (on version tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
