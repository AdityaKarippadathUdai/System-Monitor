name: Build Windows Installer (.exe & .msi)

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    name: Windows x64 NSIS (.exe) & MSI Build
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Rust stable MSVC toolchain (x64)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Clean npm installation
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force node_modules -ErrorAction SilentlyContinue
          if (Test-Path "package-lock.json") {
            npm ci --include=optional
          } else {
            npm install --include=optional
          }

      - name: Verify Rollup installation
        run: npm ls rollup @rollup/rollup-win32-x64-msvc

      - name: TypeScript typecheck
        run: npm run lint

      - name: Build application
        run: npm run build

      - name: Verify Rust Windows compilation
        working-directory: src-tauri
        run: cargo check --locked --all-targets

      - name: Build Tauri Windows x64 MSI installer (.msi)
        run: npm run tauri build -- --bundles msi

      - name: Ensure NSIS is available
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/ensure-nsis.ps1

      - name: Build Tauri Windows x64 NSIS installer (.exe)
        run: npm run tauri build -- --bundles nsis

      - name: Verify generated Windows installers
        shell: pwsh
        run: |
          $nsis = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -ErrorAction SilentlyContinue
          $msi = Get-ChildItem -Path "src-tauri/target/release/bundle/msi" -Filter "*.msi" -ErrorAction SilentlyContinue
          if (-not $nsis) {
            Write-Error "No NSIS .exe installer found in src-tauri/target/release/bundle/nsis/"
            exit 1
          }
          if (-not $msi) {
            Write-Error "No MSI installer found in src-tauri/target/release/bundle/msi/"
            exit 1
          }
          Write-Host "Generated NSIS installer(s):"
          $nsis | ForEach-Object { Write-Host " - $($_.FullName) ($($_.Length) bytes)" }
          Write-Host "Generated MSI installer(s):"
          $msi | ForEach-Object { Write-Host " - $($_.FullName) ($($_.Length) bytes)" }

      - name: Upload Windows installers artifact
        uses: actions/upload-artifact@v6
        with:
          name: SysMon-Pro-Windows-x64-Setup
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Publish GitHub Release (on version tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
