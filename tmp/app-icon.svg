<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1726" />
      <stop offset="50%" stop-color="#080D1A" />
      <stop offset="100%" stop-color="#03060C" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="35%" stop-color="#2563EB" />
      <stop offset="70%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Inner Glow Gradient -->
    <radialGradient id="innerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#0369A1" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0369A1" stop-opacity="0" />
    </radialGradient>

    <!-- Wave Pulse Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4" />
      <stop offset="25%" stop-color="#38BDF8" />
      <stop offset="55%" stop-color="#60A5FA" />
      <stop offset="85%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.4" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur1" />
      <feGaussianBlur stdDeviation="32" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Chip Gradient -->
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <!-- Base Squircle -->
  <rect x="32" y="32" width="960" height="960" rx="220" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="24" />

  <!-- Center Ambient Radial Glow -->
  <circle cx="512" cy="512" r="380" fill="url(#innerGlow)" />

  <!-- Grid Pattern Elements (Hardware/Monitor aesthetic) -->
  <g opacity="0.12" stroke="#38BDF8" stroke-width="2">
    <line x1="212" y1="212" x2="812" y2="212" />
    <line x1="212" y1="362" x2="812" y2="362" />
    <line x1="212" y1="512" x2="812" y2="512" />
    <line x1="212" y1="662" x2="812" y2="662" />
    <line x1="212" y1="812" x2="812" y2="812" />
    <line x1="212" y1="212" x2="212" y2="812" />
    <line x1="362" y1="212" x2="362" y2="812" />
    <line x1="512" y1="212" x2="512" y2="812" />
    <line x1="662" y1="212" x2="662" y2="812" />
    <line x1="812" y1="212" x2="812" y2="812" />
  </g>

  <!-- Monitor / Sensor Shield Bezel -->
  <rect x="180" y="240" width="664" height="544" rx="36" fill="url(#chipGrad)" stroke="#1E293B" stroke-width="8" opacity="0.9" />
  <rect x="204" y="264" width="616" height="496" rx="24" fill="#030712" stroke="#0284C7" stroke-width="4" stroke-opacity="0.3" />

  <!-- Corner Tech Accents -->
  <path d="M 230 310 L 230 280 L 260 280" fill="none" stroke="#38BDF8" stroke-width="8" stroke-linecap="round" />
  <path d="M 794 310 L 794 280 L 764 280" fill="none" stroke="#38BDF8" stroke-width="8" stroke-linecap="round" />
  <path d="M 230 714 L 230 744 L 260 744" fill="none" stroke="#38BDF8" stroke-width="8" stroke-linecap="round" />
  <path d="M 794 714 L 794 744 L 764 744" fill="none" stroke="#38BDF8" stroke-width="8" stroke-linecap="round" />

  <!-- Activity / Pulse Waveform Glow Layer -->
  <path d="M 230 512 L 340 512 L 390 410 L 440 600 L 512 320 L 580 680 L 634 460 L 670 540 L 710 512 L 794 512"
        fill="none"
        stroke="#0284C7"
        stroke-width="40"
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity="0.4"
        filter="url(#neonGlow)" />

  <!-- Primary Glowing Activity / Telemetry Waveform -->
  <path d="M 230 512 L 340 512 L 390 410 L 440 600 L 512 320 L 580 680 L 634 460 L 670 540 L 710 512 L 794 512"
        fill="none"
        stroke="url(#waveGrad)"
        stroke-width="26"
        stroke-linecap="round"
        stroke-linejoin="round" />

  <!-- Waveform Core Highlight -->
  <path d="M 230 512 L 340 512 L 390 410 L 440 600 L 512 320 L 580 680 L 634 460 L 670 540 L 710 512 L 794 512"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="8"
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity="0.85" />

  <!-- Peak Telemetry Pulse Nodes -->
  <circle cx="512" cy="320" r="16" fill="#FFFFFF" stroke="#38BDF8" stroke-width="6" />
  <circle cx="580" cy="680" r="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="6" />
  <circle cx="390" cy="410" r="12" fill="#FFFFFF" stroke="#38BDF8" stroke-width="4" />
  <circle cx="440" cy="600" r="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="4" />

  <!-- Status Indicator Dot -->
  <circle cx="760" cy="300" r="12" fill="#22C55E" />
  <circle cx="760" cy="300" r="20" fill="none" stroke="#22C55E" stroke-width="3" opacity="0.6" />
</svg>
